[project]
name = "multiagent-v3"
version = "0.1.0"
description = "멀티에이전트 패턴 샘플 — Supervisor/Handoff/Plan-and-Execute/병렬/리뷰어 + MCP + 운영 가드레일"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "mcp>=1.8,<2",
    "langgraph>=0.2.60",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
