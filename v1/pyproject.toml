[project]
name = "agent"
version = "0.1.0"
description = "Framework-free ReAct agent with tool calling (pure OpenAI SDK)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "tzdata>=2024.1",  # Windows에 zoneinfo tzdb가 없어서 필요
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
